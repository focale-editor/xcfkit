name: xcfkit
description: A pure Dart reader and writer for layered GIMP XCF documents, pixels, masks, and metadata.
version: 0.1.0
homepage: https://github.com/focale-editor/xcfkit
repository: https://github.com/focale-editor/xcfkit

topics:
  - gimp
  - xcf
  - image-processing
  - codec
  - file-format

screenshots:
  - description: 'A flat illustration of an editable PSD or PSB document.'
    path: screenshots/overview.png

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  xml: ^7.1.0
  zcodec: ^0.2.5

dev_dependencies:
  crypto: ^3.0.8
  lints: ^6.1.0
  test: ^1.32.0
  release: ^0.1.11

release:
  changelog:
    header: '# 📰 XcfKit changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
